name: Lint Check
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - run: go version
      #- run: diff -u <(echo -n) <(gofmt -d .)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2.13.2 is the first release line built with a Go toolchain
          # (1.27.0) that can load a module targeting go 1.27; older
          # golangci-lint binaries refuse the go directive outright.
          version: v2.13.2
          args: --enable=nolintlint,gochecknoinits,bodyclose --verbose
