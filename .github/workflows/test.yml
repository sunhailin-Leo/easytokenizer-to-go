name: Test
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
jobs:
  Build:
    strategy:
      matrix:
        go-version: [1.27.x]
        platform: [ubuntu-latest, macos-latest]
        goexperiment: ['']
        include:
          - platform: ubuntu-latest
            go-version: 1.27.x
            goexperiment: simd
          - platform: macos-latest
            go-version: 1.27.x
            goexperiment: simd
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Setup Golang caches
        uses: actions/cache@v5
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ matrix.goexperiment }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-${{ matrix.goexperiment }}-
      - name: Fetch Repository
        uses: actions/checkout@v7
      - name: Run Test
        env:
          GOEXPERIMENT: ${{ matrix.goexperiment }}
        run: go test ./... -v -race
