name: Test
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
jobs:
  Build:
    strategy:
      matrix:
        go-version: [1.18.x, 1.19.x, 1.20.x, 1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x]
        platform: [ubuntu-latest, macos-13]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.1
        with:
          cmake-version: '3.26.x'
      - name: Check cmake
        run: cmake --version
      - name: Setup Golang caches
        uses: actions/cache@v5
        with:
          # In order:
          # * Module download cache
          # * Build cache (Linux)
          # * Build cache (Mac)
          # * Build cache (Windows)
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
      - name: Fetch Repository
        uses: actions/checkout@v7
      - name: Build And Install C++ Library
        run: |
          cmake --version
          cd ${{github.workspace}}
          mkdir -p build
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake .. -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          else
            cmake ..
          fi
          make
          sudo make install
          ls
      - name: Run Test
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 15
          command: |
            ls /usr/local/lib | grep libtokenizer
            export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
            export DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:/usr/local/lib
            export CGO_LDFLAGS="-L/usr/local/lib -Wl,-rpath,/usr/local/lib"
            go test ./... -v -race
  Stable:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-13]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2.1
        with:
          cmake-version: '3.26.x'
      - name: Fetch Repository
        uses: actions/checkout@v7
      - name: Setup Golang caches
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~\AppData\Local\go-build
          key: ${{ runner.os }}-go-stable-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-stable-
      - name: Build And Install C++ Library
        run: |
          mkdir -p build
          cd build
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake .. -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          else
            cmake ..
          fi
          make
          sudo make install
      - name: Run Test
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          timeout_minutes: 15
          command: |
            ls /usr/local/lib | grep libtokenizer
            export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:/usr/local/lib
            export DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH:/usr/local/lib
            export CGO_LDFLAGS="-L/usr/local/lib -Wl,-rpath,/usr/local/lib"
            go test ./... -v -race
